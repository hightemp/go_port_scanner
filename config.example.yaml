# Targets may contain hostnames, individual IPv4/IPv6 addresses, CIDR
# subnets, or inclusive IP ranges. CIDRs include every address in the subnet.
targets:
  - localhost
  # - 192.168.1.0/24
  # - 192.168.2.10-192.168.2.50
  # - 192.168.3.10-50
  # - 2001:db8::/126

# A port may be a single number or an inclusive range.
ports:
  - 1-65535

scanner:
  workers: 10000
  # Maximum unique targets after expanding CIDRs and ranges.
  max_targets: 65536
  dial_timeout: 1s
  # Zero disables the timeout for the whole scan.
  scan_timeout: 0s
  # Periodic progress output at info level. Zero disables progress messages.
  progress_interval: 5s
  # Available values: quiet, info, debug, trace.
  verbosity: quiet

# Optional host availability check performed before the full port scan.
discovery:
  enabled: false
  # Available values: none, tcp, icmp, icmp_then_tcp.
  # icmp_then_tcp tolerates blocked or unavailable ICMP by falling back to TCP.
  strategy: icmp_then_tcp
  workers: 256
  # Per ICMP request or TCP port attempt.
  timeout: 500ms
  # Used by tcp and icmp_then_tcp. A successful connection or explicit
  # connection refusal means that the host is reachable.
  tcp_ports: [22, 80, 443, 445, 3389, 5985]

# Optional final report. Destinations stdout and stderr are reserved; any other
# value is treated as a file path. Missing parent directories are created.
report:
  enabled: false
  destination: scan-report.json
  # Available values: text, json, jsonl, csv.
  format: json

proxy:
  enabled: false
  # Available values: round_robin, random, least_connections.
  strategy: round_robin
  # Keep false unless an HTTPS proxy uses a certificate you explicitly trust.
  tls_insecure_skip_verify: false
  # Authentication may be included in a URL: http://user:password@proxy:8080.
  # Supported schemes: http, https, socks5, socks5h, socks (SOCKS5 alias).
  urls: []
  # urls:
  #   - http://127.0.0.1:8080
  #   - https://proxy.example.com:8443
  #   - socks5://127.0.0.1:1080

# Application handshakes run only after a successful TCP connection. The
# global switch and every protocol switch can be disabled independently.
probes:
  enabled: false
  timeout: 2s
  # Applies to HTTPS, FTPS, LDAPS, and WinRM HTTPS certificates. Keep false in production.
  tls_insecure_skip_verify: false

  ssh:
    enabled: true
    ports: [22]

  # Plain FTP, explicit FTPS (AUTH TLS), and implicit FTPS are independent.
  # FTP and explicit FTPS intentionally share port 21 and use separate
  # connections when both are enabled.
  ftp:
    enabled: true
    ports: [21]
  ftps_explicit:
    enabled: true
    ports: [21]
  ftps_implicit:
    enabled: true
    ports: [990]

  # HTTP sends HEAD /. HTTPS first performs a TLS handshake. SOCKS performs
  # only SOCKS5 authentication-method negotiation and never sends CONNECT.
  http:
    enabled: true
    ports: [80]
  https:
    enabled: true
    ports: [443]
  socks:
    enabled: true
    ports: [1080]

  postgresql:
    enabled: true
    ports: [5432]
  mysql:
    enabled: true
    ports: [3306]
  mongodb:
    enabled: true
    ports: [27017]
  mssql:
    enabled: true
    ports: [1433]
  cassandra:
    enabled: true
    ports: [9042]
  elasticsearch:
    enabled: true
    ports: [9200]

  rabbitmq:
    enabled: true
    ports: [5672]
  kafka:
    enabled: true
    ports: [9092]
  nats:
    enabled: true
    ports: [4222]
  mqtt:
    enabled: true
    ports: [1883]

  redis:
    enabled: true
    ports: [6379]
  memcached:
    enabled: true
    ports: [11211]
  etcd:
    enabled: true
    # Probe ports accept the same ranges as the main ports list.
    ports: [2379]

  # Windows and Active Directory services.
  rdp:
    enabled: true
    ports: [3389]
  smb:
    enabled: true
    ports: [445]
  netbios:
    enabled: true
    ports: [139]
  msrpc:
    enabled: true
    ports: [135]
  kerberos:
    enabled: true
    ports: [88]
  # Includes the Active Directory Global Catalog ports.
  ldap:
    enabled: true
    ports: [389, 3268]
  ldaps:
    enabled: true
    ports: [636, 3269]
  winrm:
    enabled: true
    ports: [5985]
  winrm_https:
    enabled: true
    ports: [5986]
